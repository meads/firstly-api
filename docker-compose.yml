services:
  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: firstly
      POSTGRES_PASSWORD: firstly
      POSTGRES_DB: firstly
    restart: always
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://firstly:firstly@db:5432/firstly?sslmode=disable
      - SECRET=secret
    depends_on:
      - db
    restart: always
    # volumes:
    #   - ./webapp:/opt/webapp
